<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Book</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
            font-weight: 600;
        }

        .back-button:hover {
            background: #0056b3;
        }

        body {
            position: relative;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
        .btn-home {
            margin-bottom: 20px;
            text-decoration: none;
            background-color: rgb(43, 57, 135);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .btn-home:hover {
            background-color: rgb(20, 28, 58);
        }
        
    </style>
</head>

<body>
<div class="form-container">
    <h2>📚 Issue Book</h2>

    <form method="post">
        {% csrf_token %}

        <label>{{ form.student.label }}</label>
        {{ form.student }}

        <label>{{ form.book.label }}</label>
        {{ form.book }}

        <label>Return Date</label>
        {{ form.return_date }}

        <button type="submit">Issue Book</button>
        <br><br>
        <a href="{% url 'home' %}" class="btn btn-secondary btn-home">← Back to Home</a>
    </form>
</div>

</body>
</html>
